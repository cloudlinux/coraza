# Checks that SecRxPreFilter On and Off agree on the Imunify360 ruleset published today, for the
# fork build that was just tagged. See docs/rx-prefilter-gate.md. A red run means: do not enable
# SecRxPreFilter On with this tag.
name: Rx prefilter gate

on:
  push:
    tags:
      - "v*-cl*"
  workflow_dispatch:
    inputs:
      mode:
        description: "pattern (seconds) or full (about 10 minutes, adds the end-to-end replay)"
        type: choice
        options:
          - full
          - pattern
        default: full

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.x
          cache: true
      - name: Prefilter gate
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: bash scripts/rx-prefilter-gate.sh --download --mode "$MODE"
      - name: Summary
        if: always()
        run: |
          if [ -f build/rx-prefilter-gate/summary.txt ]; then
            { echo '```'; cat build/rx-prefilter-gate/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
